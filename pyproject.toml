[project]
name = "deck-manager"
version = "0.1.0"
description = "Keyboard-first terminal UI for managing local Docker Engine state"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "textual~=8.2",
  "docker==7.2.0",
  "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.26",
  "pytest-cov>=6",
  "ruff>=0.12",
  "mypy~=1.18",
  "types-docker",
]

[project.scripts]
deck = "docker_tui.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docker_tui"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: tests requiring a live Docker daemon",
]
addopts = "--cov=src --cov-report=term --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
